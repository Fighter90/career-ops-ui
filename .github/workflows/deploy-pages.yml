name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/help/**'
      - 'images/dashboard-*.png'
      - '.github/workflows/deploy-pages.yml'
  # Weekly rebuild so build-time repo facts (star-count fallback, contributors
  # grid) refresh even when nothing lands on main.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment, but do NOT cancel an in-progress
# one — a superseded build that gets cancelled surfaces as a red "check" in the
# commit-status rollup ("Some checks were not successful") even though nothing
# broke. Queuing instead of cancelling keeps the status green. This is GitHub's
# own recommended Pages pattern. (A push that touches docs/help/** or site/**
# already auto-fires this workflow, so a manual dispatch on the same merge is
# what created the race — prefer letting the push trigger handle it.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Sync repo assets + build
        working-directory: site
        env:
          # Authenticated GitHub API calls in sync-assets.mjs (stars +
          # contributors) — shared-runner IPs exhaust the anonymous limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/sync-assets.mjs
          npx astro check
          node scripts/check-i18n.mjs
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
