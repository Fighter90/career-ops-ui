# One-off (CAR-251) — remove the dead telegram channel php_vakansii1 from the
# prod portals.yml (t.me stopped serving its web feed; it failed the live-scan
# remote-QA job twice). portals.yml is gitignored user data on the server, so
# the fix rides an SSH one-off instead of the git tree. Delete this workflow
# file once it has run.
name: One-off CAR-251 — prod portals.yml dead-channel removal

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Configure ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          for v in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            BatchMode yes
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config
          ssh prod true
          echo "ssh ok"

      - name: Patch prod portals.yml (backup first, idempotent)
        run: |
          ssh prod "bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR=/opt/career-ops/src
          ROOT=$(systemctl show -p Environment --value career-ops-ui 2>/dev/null | tr ' ' '\n' | grep '^CAREER_OPS_ROOT=' | cut -d= -f2- || true)
          printf 'service CAREER_OPS_ROOT: %s\n' "${ROOT:-<unset, falling back to checkout paths>}"
          patched=0
          seen=""
          for f in "${ROOT:+$ROOT/portals.yml}" "$APP_DIR/portals.yml" "$APP_DIR/web-ui/portals.yml"; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            case "$seen" in *"|$f|"*) continue;; esac
            seen="$seen|$f|"
            echo "== $f"
            n=$(grep -c 'channel: php_vakansii1' "$f" || true)
            if [ "$n" -gt 0 ]; then
              cp -p "$f" "$f.bak-$(date +%Y%m%d%H%M%S)"
              sed -i 's|^    - { name: "PHP вакансии (1)",        channel: php_vakansii1 }$|    # php_vakansii1 removed 2026-11-08 (CAR-251): t.me stopped serving its web feed (Contact stub, 0 posts) — it failed the live-scan remote-QA job twice.|' "$f"
              n2=$(grep -c 'channel: php_vakansii1' "$f" || true)
              [ "$n2" = 0 ] || { echo "::error::$f still carries the dead channel"; exit 1; }
              echo "patched: dead channel line replaced with a comment (was $n)"
              patched=1
            else
              echo "already clean"
            fi
            # YAML must still parse before we touch the service.
            node -e "require('$APP_DIR/web-ui/node_modules/js-yaml').load(require('fs').readFileSync('$f','utf8')); console.log('yaml ok')"
          done
          [ "$seen" != "" ] || { echo "::error::no portals.yml found on the server"; exit 1; }
          if [ "$patched" = 1 ]; then
            sudo -n systemctl restart career-ops-ui 2>/dev/null || systemctl restart career-ops-ui
            sleep 6
            h=$(curl -fsS --max-time 10 http://127.0.0.1:4317/api/health)
            echo "$h" | head -c 300; echo
            echo "$h" | grep -q '"ok":true' || { echo "::error::health not ok after restart"; exit 1; }
            echo "service restarted, health ok"
          else
            echo "nothing to patch — service untouched"
          fi
          REMOTE
