name: Authorize SSH key (one-off)

# One-off, manual: append ONE operator public key to authorized_keys on the
# production box (root and the service user), using the CI deploy key. Exists
# because the operator's local deploy key lost its passphrase (2026-10-07).
# Remove this workflow after use.

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: 'One ssh-ed25519 public key line (type, base64, optional comment)'
        required: true

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    steps:
      - name: Validate key
        env:
          KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          [[ "$KEY" =~ ^ssh-ed25519\ AAAAC3NzaC1lZDI1NTE5[A-Za-z0-9+/]{48,}={0,2}(\ [A-Za-z0-9._@-]{1,64})?$ ]] \
            || { echo "::error::not a single ssh-ed25519 public key line"; exit 1; }
          printf '%s\n' "$KEY" > key.pub
          ssh-keygen -lf key.pub
      - name: Append on the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          for v in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key; chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$KEY" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          read -r key
          add() {
            local home=$1 owner=$2
            install -d -m 700 -o "$owner" -g "$owner" "$home/.ssh"
            touch "$home/.ssh/authorized_keys"
            if grep -qxF -- "$key" "$home/.ssh/authorized_keys"; then
              echo "$owner: already present"
            else
              printf '%s\n' "$key" >> "$home/.ssh/authorized_keys"
              echo "$owner: added"
            fi
            chown "$owner:$owner" "$home/.ssh/authorized_keys"; chmod 600 "$home/.ssh/authorized_keys"
          }
          add /root root
          if id careerops >/dev/null 2>&1; then add "$(getent passwd careerops | cut -d: -f6)" careerops; fi
          REMOTE
      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key
