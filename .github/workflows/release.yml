name: Release

# Creates a GitHub Release whenever a tag matching `v*.*.*` is pushed.
# Manual trigger:
#   git tag v1.7.0
#   git push origin v1.7.0
#
# The release notes are pulled directly from CHANGELOG.md so all 8
# language variants stay the canonical source of truth.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.7.0)'
        required: true

permissions:
  contents: write
  actions: write   # dispatch publish-package.yml (see the last step)

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Checks out the triggering ref: the tag on a tag push, the
          # dispatched branch (main) on workflow_dispatch. The next step
          # switches to the tag when it already exists.

      # A dispatch may name a tag that does not exist yet (tags cannot
      # always be pushed from where the release is cut). Then the tree
      # stays at the dispatched commit, the version check below guards
      # it, and the release step creates the tag at that commit.
      - name: Use the tag's tree when the tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag must look like v1.2.3"; exit 1; }
          if git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
            git checkout --quiet "$TAG"
            echo "releasing existing tag $TAG"
          else
            echo "tag $TAG does not exist yet — it will be created at $GITHUB_SHA"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          # Resolved by the Actions expression engine, not the shell:
          # `inputs.tag` is set only on workflow_dispatch, else use the
          # pushed tag. (The old `${GITHUB_REF_NAME:-…}` shell form
          # never used the input — GITHUB_REF_NAME is "main", not empty,
          # on dispatch — so manual releases were impossible.)
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # Slice between "## [VERSION]" and the next "## ["
          awk -v v="$version" '
            $0 ~ "^## \\["v"\\]" {flag=1; print; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > .release-notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "${{ steps.notes.outputs.version }}" ]; then
            echo "package.json says $pkg, tag says ${{ steps.notes.outputs.version }}"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.tag }}
          tag_name: ${{ steps.notes.outputs.tag }}
          # Used only when the tag does not exist yet (dispatch, see above).
          target_commitish: ${{ github.sha }}
          body_path: .release-notes.md
          draft: false
          prerelease: ${{ contains(steps.notes.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A release created with GITHUB_TOKEN does not fire `release: published`
      # for other workflows, so publish-package.yml never ran for v1.238.1 /
      # v1.238.2. workflow_dispatch is the one event GITHUB_TOKEN may trigger.
      # Publishing is idempotent, so a second run from a UI-created release
      # is a green no-op.
      - name: Publish the npm package for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.notes.outputs.tag }}
        run: |
          # The tag was created moments ago by the release step; give the API
          # a few seconds to see it before giving up.
          for i in 1 2 3; do
            gh workflow run publish-package.yml --ref "$TAG" --repo "$GITHUB_REPOSITORY" && exit 0
            sleep $((i * 5))
          done
          exit 1
