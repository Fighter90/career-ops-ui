name: Deploy (server)

# Manual deploy of the parent career-ops checkout + this web-ui to the
# production box (Timeweb server 8801467).
#
#   mode=recon   read-only: prints both git checkouts, versions, the state of
#                the systemd services (web-ui, Hermes gateway), and /api/health.
#                Changes nothing on the server. Run this first.
#   mode=cleanup-plan  read-only dry run of scripts/post-qa-cleanup.mjs on the
#                server: prints the plan (counts only, no file names — the log
#                is public and file names carry company names). Changes nothing.
#   mode=cleanup-apply  applies the cleanup (with automatic backups). Owner
#                approval required BEFORE dispatching this mode.
#   mode=verify  read-only smoke of the running app on the server: every
#                read-only JSON route, the SPA shell, served sources == the
#                deployed registry, the Hermes
#                bridge, and error lines in the unit journal since start.
#                Also runs after every deploy.
#   mode=deploy  extracts `git archive parent_ref` over the app dir and
#                `git archive ui_ref` over its web-ui/ subdir (the way this
#                server has always been updated), installs production deps if
#                a lockfile changed, restarts the service and verifies
#                /api/health. Every overwritten file is backed up first, and any
#                failure restores it and removes the files the deploy created.
#
# Secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY      private half of the passphrase-less `careerops-ci` key
#   DEPLOY_HOST         server address
#   DEPLOY_USER         ssh user
#   DEPLOY_KNOWN_HOSTS  pinned `known_hosts` line(s); required for mode=deploy.
#                       A recon run without it trusts the key it sees and
#                       prints it so it can be pinned.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'recon (read-only), deploy, or verify (read-only smoke of the live app)'
        type: choice
        options: [recon, deploy, verify, cleanup-plan, cleanup-apply]
        default: recon
      app_dir:
        description: 'Parent career-ops checkout on the server (web-ui is its web-ui/ subdir)'
        default: /opt/career-ops/src
      parent_ref:
        description: 'Parent career-ops ref to deploy (tag, branch or sha)'
        default: f4f55def
      ui_ref:
        description: 'web-ui ref to deploy'
        default: v1.238.0
      service:
        description: 'systemd unit of the web-ui'
        default: career-ops-ui
      port:
        description: 'Port the app listens on at 127.0.0.1 (see recon)'
        default: '4317'
      heap_mb:
        description: 'V8 old-space limit for the viewer in MB (systemd drop-in); 0 = leave as is'
        default: '448'
      public_url:
        description: 'Public origin checked over HTTPS after the run (empty = secret PROD_URL)'
        default: ''
      allowed_hosts:
        description: 'Public host name(s) the reverse proxy forwards, comma separated (ALLOWED_HOSTS). Empty = the host of public_url / secret PROD_URL. The app refuses any other DNS name in the Host header.'
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.mode }} ${{ inputs.app_dir }}
    runs-on: ubuntu-latest
    # 40: a deploy may wait up to 15 min for a running hourly scan (hold_timers).
    timeout-minutes: 40
    permissions:
      contents: read
    environment: production
    steps:
      - name: Configure ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APP_DIR: ${{ inputs.app_dir }}
          PARENT_REF: ${{ inputs.parent_ref }}
          UI_REF: ${{ inputs.ui_ref }}
          SERVICE: ${{ inputs.service }}
          PORT: ${{ inputs.port }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # These are spliced into a remote shell command line below.
          if ! [[ "$PORT" =~ ^[0-9]{1,5}$ ]] || (( PORT < 1 || PORT > 65535 )); then
            echo "::error::port must be 1-65535"; exit 1
          fi
          for v in APP_DIR PARENT_REF UI_REF SERVICE; do
            [[ "${!v}" =~ ^[A-Za-z0-9._/@-]*$ ]] || { echo "::error::input $v has characters outside [A-Za-z0-9._/@-]"; exit 1; }
          done
          for v in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            hostcheck=yes
          elif [ "$MODE" = deploy ]; then
            echo "::error::mode=deploy needs the DEPLOY_KNOWN_HOSTS secret (a recon run prints the key to pin)"; exit 1
          else
            hostcheck=accept-new
          fi
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking $hostcheck
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
          EOF
          chmod 600 ~/.ssh/config
          ssh prod true
          echo "Host key now trusted (pin it as DEPLOY_KNOWN_HOSTS):"
          cat ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts


      - name: Recon (read-only)
        env:
          APP_DIR: ${{ inputs.app_dir }}
          PORT: ${{ inputs.port }}
        run: |
          # This repo is public, and so are its Actions logs: print versions,
          # states and paths only, never file contents, profile data or env.
          # shellcheck disable=SC2029  # APP_DIR/PORT are meant to expand locally
          ssh prod "APP_DIR='$APP_DIR' PORT='$PORT' bash -s" <<'REMOTE'
          set -uo pipefail
          sec() { printf '\n===== %s =====\n' "$1"; }
          as_owner() { local d=$1; shift; sudo -u "$(stat -c %U "$d")" -H -- "$@"; }
          sec host;     . /etc/os-release && echo "$PRETTY_NAME"; uptime; df -h / | tail -1
          sec node;     node -v; npm -v
          for d in "$APP_DIR" "$APP_DIR/web-ui"; do
            sec "git $d"
            if [ -e "$d/.git" ]; then
              echo "owner: $(stat -c %U "$d")"
              as_owner "$d" git -C "$d" remote -v | sed -E 's#://[^@/]+@#://#'
              as_owner "$d" git -C "$d" log -1 --format='%h %d %s (%ci)'
              as_owner "$d" git -C "$d" describe --tags --always 2>/dev/null
              echo "tracked files differing from HEAD: $(as_owner "$d" git -C "$d" status --porcelain --untracked-files=no | wc -l)"
            else
              echo "not a git checkout"
            fi
          done
          # Earlier deploys copied files over stale checkouts, so HEAD says little.
          # Find the release commit the files on disk actually match, and list
          # whatever differs from it (a hand edit on the server would show here).
          # Only .git refs change (fetch); the working tree is not touched.
          sec drift
          ui_ver=$(node -p "require('$APP_DIR/web-ui/package.json').version" 2>/dev/null)
          # Narrow force-fetch: only the tag the on-disk tree claims to match.
          # A blanket `fetch --tags --force` would let ANY re-pointed tag on
          # origin move server refs (AI-review blocker, PR #407 follow-up).
          if [ -n "$ui_ver" ]; then
            as_owner "$APP_DIR/web-ui" git -C "$APP_DIR/web-ui" fetch --force --quiet origin "refs/tags/v$ui_ver:refs/tags/v$ui_ver" || true
          fi
          echo "web-ui on disk vs v$ui_ver: $(as_owner "$APP_DIR/web-ui" git -C "$APP_DIR/web-ui" diff --name-only "v$ui_ver" | wc -l) files differ"
          echo "files on disk with lines not in v$ui_ver (hand edits?):"
          as_owner "$APP_DIR/web-ui" git -C "$APP_DIR/web-ui" diff --numstat "v$ui_ver" | awk '$1>0' | head -40
          as_owner "$APP_DIR" git -C "$APP_DIR" fetch --quiet origin
          echo "parent origin/main: $(as_owner "$APP_DIR" git -C "$APP_DIR" log -1 --format='%h %s (%ci)' origin/main)"
          echo "parent VERSION at origin/main: $(as_owner "$APP_DIR" git -C "$APP_DIR" show origin/main:VERSION | head -1)"
          best=""; bestn=999999
          for c in $(as_owner "$APP_DIR" git -C "$APP_DIR" rev-list --max-count=250 origin/main); do
            n=$(as_owner "$APP_DIR" git -C "$APP_DIR" diff --name-only "$c" | wc -l)
            if [ "$n" -lt "$bestn" ]; then best=$c; bestn=$n; fi
            [ "$n" -eq 0 ] && break
          done
          echo "parent on disk best matches $(as_owner "$APP_DIR" git -C "$APP_DIR" log -1 --format='%h %s (%ci)' "$best"): $bestn files differ"
          echo "files on disk with lines not in that commit (hand edits?):"
          as_owner "$APP_DIR" git -C "$APP_DIR" diff --numstat "$best" | awk '$1>0' | head -40
          for d in "$APP_DIR" "$APP_DIR/web-ui"; do
            echo "$d: node_modules $([ -d "$d/node_modules" ] && echo present || echo absent)"
          done
          sec versions
          echo "parent VERSION: $(cat "$APP_DIR/VERSION" 2>/dev/null)"
          echo "web-ui package: $(node -p "require('$APP_DIR/web-ui/package.json').version" 2>/dev/null)"
          sec services
          for u in career-ops-ui hermes-gateway claude-bridge career-ops-scan career-ops-eval; do
            printf '%-18s %s\n' "$u" "$(systemctl is-active "$u" 2>/dev/null)"
          done
          systemctl list-timers --all --no-pager 2>/dev/null | grep -E 'career|hermes' || true
          sec hourly-scan
          # What the timer runs — decides whether it scans in-process. Counts and
          # yes/no only: printing the lines, even masked, leaked the token after
          # "Authorization: Bearer", and this log is public.
          hs=/opt/career-ops/hourly-scan.sh
          if [ -f "$hs" ]; then
            yn() { grep -qiE "$1" "$hs" && echo yes || echo no; }
            echo "lines: $(wc -l < "$hs") · curl calls: $(grep -c 'curl' "$hs") · node calls: $(grep -cE '(^|[^[:alnum:]_])node ' "$hs")"
            echo "calls /api/scan: $(yn '/api/scan') · calls /api/ (any): $(yn '/api/') · runs a scan script: $(yn 'scan\.mjs')"
            echo "carries credentials: $(yn 'authorization|bearer|token|pass(word)?|[[:space:]]-u[[:space:]]|://[^/ ]+@')"
          else
            echo "not present"
          fi
          sec eval-timer
          # v1.248.5 — server-side skip contract: the auto-pipeline marks
          # rejected entries in data/pipeline.md (## Rejected section below
          # the fence); the timer greps bare URLs in the fence and naturally
          # skips the marked ones. Count the marks (numbers only).
          marks=$(grep -c '^- .*rejected:' "$APP_DIR/data/pipeline.md" 2>/dev/null || echo 0)
          echo "pipeline rejected marks: $marks"
          echo "honours rejected: yes (server-side — marks in data/pipeline.md)"
          sec node-heap
          systemctl show -p Environment --value career-ops-ui 2>/dev/null | tr ' ' '\n' | grep -E '^NODE_OPTIONS=' || echo "NODE_OPTIONS unset (V8 default heap)"
          sec listeners; ss -ltnp 2>/dev/null | awk 'NR>1{print $4, $6}' | grep -E 'node|python|hermes|caddy' || true
          sec hermes-link
          grep -hoE '^HERMES_BASE_URL=.*' "$APP_DIR/.env" 2>/dev/null | sed -E 's#://[^/@]+@#://…@#; s#[?].*$#?…#' || echo "HERMES_BASE_URL unset (default http://127.0.0.1:8642/v1)"
          for u in http://127.0.0.1:8642/v1/models http://127.0.0.1:8788/; do
            printf '%s -> %s\n' "$u" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$u")"
          done
          sec health
          if ! h=$(curl -fsS --max-time 10 "http://127.0.0.1:$PORT/api/health"); then echo "health: viewer not answering on :$PORT"; else echo "$h" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const h=JSON.parse(s);
              console.log("ok="+h.ok+" version="+h.version+" parentVersion="+h.parentVersion+" warnings="+h.warnings);
              for (const c of h.checks||[]) if (c.required && !c.ok) console.log("REQUIRED FAIL: "+c.name);})'; fi
          true
          REMOTE

      - name: Deploy
        if: inputs.mode == 'deploy'
        env:
          APP_DIR: ${{ inputs.app_dir }}
          PARENT_REF: ${{ inputs.parent_ref }}
          UI_REF: ${{ inputs.ui_ref }}
          SERVICE: ${{ inputs.service }}
          PORT: ${{ inputs.port }}
          HEAP_MB: ${{ inputs.heap_mb }}
          ALLOWED_HOSTS_IN: ${{ inputs.allowed_hosts }}
          PUBLIC_URL_IN: ${{ inputs.public_url || secrets.PROD_URL }}
        run: |
          [[ "$HEAP_MB" =~ ^[0-9]{1,5}$ ]] || { echo "::error::heap_mb must be a number"; exit 1; }
          # Host allowlist for the app's request guard (server/lib/request-guard.mjs).
          # The proxy forwards the public name in the Host header; without it listed
          # the app answers 421 to every real visitor. Derived from the public URL
          # unless given explicitly; validated to a plain host list before it goes
          # anywhere near a systemd unit.
          ALLOWED_HOSTS="$ALLOWED_HOSTS_IN"
          if [ -z "$ALLOWED_HOSTS" ] && [ -n "$PUBLIC_URL_IN" ]; then
            ALLOWED_HOSTS=$(printf '%s' "$PUBLIC_URL_IN" | sed -E 's#^[A-Za-z][A-Za-z0-9+.-]*://##; s#[/:?#].*$##')
          fi
          [[ -z "$ALLOWED_HOSTS" || "$ALLOWED_HOSTS" =~ ^[A-Za-z0-9.,*-]+$ ]] || { echo "::error::allowed_hosts must be host names separated by commas"; exit 1; }
          [ -n "$ALLOWED_HOSTS" ] || echo "::warning::no allowed_hosts and no public_url/PROD_URL — the app will refuse every non-loopback Host name"
          # shellcheck disable=SC2029  # the inputs are meant to expand locally
          ssh prod "APP_DIR='$APP_DIR' PARENT_REF='$PARENT_REF' UI_REF='$UI_REF' SERVICE='$SERVICE' PORT='$PORT' HEAP_MB='$HEAP_MB' ALLOWED_HOSTS='$ALLOWED_HOSTS' bash -s" <<'REMOTE'
          set -euo pipefail
          UI_DIR="$APP_DIR/web-ui"
          SERVICE=${SERVICE:-career-ops-ui}
          # The checkouts belong to the service user; running git as root would
          # trip safe.directory and leave root-owned files behind.
          as_owner() { local d=$1; shift; sudo -u "$(stat -c %U "$d")" -H -- "$@"; }
          g() { local d=$1; shift; as_owner "$d" git -C "$d" "$@"; }
          lock_sum() { if [ -f "$1/package-lock.json" ]; then sha256sum "$1/package-lock.json" | cut -d' ' -f1; fi; }
          systemctl cat "$SERVICE" >/dev/null || { echo "::error::no systemd unit $SERVICE"; exit 1; }

          # The server has always been updated by copying a release over the
          # tree, never by moving HEAD, so do the same: extract `git archive REF`
          # on top. Git state is untouched apart from fetch, untracked user data
          # (cv.md, portals.yml, config/profile.yml, data/, reports/, .env) is not
          # in either archive, and every file the archive would overwrite is
          # backed up first, together with the list of files it creates.
          # --force: a re-pointed tag (v1.243.1 was re-cut after its first
          # publish) must remain deployable — a plain --tags fetch refuses to
          # clobber the stale server-side tag and every later deploy dies at
          # ref-verify. origin is the source of truth; only .git refs change.
          g "$APP_DIR" fetch --quiet origin
          # Narrow force-fetch of the ONE tag the operator explicitly asked to
          # deploy (same trust boundary as the workflow_dispatch itself) — a
          # blanket --tags --force would let any re-pointed origin tag move
          # server refs. UI_REF is pinned to release-tag format below.
          g "$UI_DIR" fetch --force --quiet origin "refs/tags/$UI_REF:refs/tags/$UI_REF"
          [[ "$UI_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::ui_ref must be a release tag (vX.Y.Z) — the deploy force-fetches exactly that tag ref"; exit 1; }
          g "$APP_DIR" rev-parse --verify --quiet "$PARENT_REF^{commit}" >/dev/null || { echo "::error::unknown parent ref $PARENT_REF"; exit 1; }
          g "$UI_DIR" rev-parse --verify --quiet "$UI_REF^{commit}" >/dev/null || { echo "::error::unknown web-ui ref $UI_REF"; exit 1; }
          [ -z "$(g "$APP_DIR" ls-tree -r --name-only "$PARENT_REF" -- web-ui)" ] || { echo "::error::parent ref tracks web-ui/; overlay would clobber the viewer"; exit 1; }

          BK="${BACKUP_ROOT:-/opt/career-ops/backups}/deploy-$(date -u +%Y%m%dT%H%M%SZ)"
          install -d -m 700 "$BK"
          parent_prev=$(head -1 "$APP_DIR/VERSION" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          ui_prev=$(node -p "require('$UI_DIR/package.json').version" 2>/dev/null || true)
          { echo "parent_prev=$parent_prev"; echo "ui_prev=$ui_prev"; } > "$BK/versions"
          declare -A ref=( ["$APP_DIR"]="$PARENT_REF" ["$UI_DIR"]="$UI_REF" ) name=( ["$APP_DIR"]=parent ["$UI_DIR"]=web-ui ) prev_lock reinstalled
          declare -A prev_ref=( ["$APP_DIR"]="${parent_prev:+v$parent_prev}" ["$UI_DIR"]="${ui_prev:+v$ui_prev}" )
          # Files the release on disk tracks but the new ref deleted. An overlay
          # never removes them on its own (a source deleted upstream kept loading
          # from disk). --no-renames: a rename's old path must count as deleted.
          # Raw paths (core.quotePath=false) so they can be fed back to rm/tar.
          deleted_since() {
            local d=$1 old=$2 new=$3 f
            g "$d" -c core.quotePath=false diff --name-only --no-renames --diff-filter=D "$old" "$new" -- | while IFS= read -r f; do
              case "$f" in web-ui/*) if [ "$d" = "$APP_DIR" ]; then continue; fi;; esac
              if [ -e "$d/$f" ] || [ -L "$d/$f" ]; then printf '%s\n' "$f"; fi
            done
          }
          for d in "$APP_DIR" "$UI_DIR"; do
            n=${name[$d]}
            prev_lock[$d]=$(lock_sum "$d")
            g "$d" ls-tree -r --name-only "${ref[$d]}" > "$BK/$n.all"
            : > "$BK/$n.existing"; : > "$BK/$n.created"; : > "$BK/$n.deleted"
            while IFS= read -r f; do
              if [ -e "$d/$f" ] || [ -L "$d/$f" ]; then echo "$f" >> "$BK/$n.existing"; else echo "$f" >> "$BK/$n.created"; fi
            done < "$BK/$n.all"
            old=${prev_ref[$d]}
            if [ -n "$old" ] && g "$d" rev-parse --verify --quiet "$old^{commit}" >/dev/null; then
              deleted_since "$d" "$old" "${ref[$d]}" > "$BK/$n.deleted"
            else
              echo "::warning::$n: release on disk (${old:-unknown}) has no tag here — files deleted upstream are left in place"
            fi
            # Deleted files go into the same backup, so a rollback restores them.
            cat "$BK/$n.deleted" >> "$BK/$n.existing"
            tar -C "$d" -czf "$BK/$n.tgz" -T "$BK/$n.existing"
            echo "$n: backup of $(wc -l < "$BK/$n.existing") files, $(wc -l < "$BK/$n.created") new, $(wc -l < "$BK/$n.deleted") to delete → $BK"
          done

          # deploy:   reinstall where the lockfile changed (or node_modules is gone).
          # rollback: reinstall exactly where the deploy reinstalled. The restored
          #           lockfile always equals prev_lock, so the deploy-mode test
          #           would keep the NEW release's node_modules under old code.
          install_deps() {
            local mode=${1:-deploy}
            for d in "$APP_DIR" "$UI_DIR"; do
              [ -f "$d/package-lock.json" ] || continue
              if [ "$mode" = rollback ]; then
                [ -n "${reinstalled[$d]:-}" ] || continue
              else
                if [ "$(lock_sum "$d")" = "${prev_lock[$d]}" ] && [ -d "$d/node_modules" ]; then
                  echo "$d: lockfile unchanged, keeping node_modules"; continue
                fi
                [ "$d" = "$APP_DIR" ] && [ ! -d "$d/node_modules" ] && { echo "$d: had no node_modules, not installing"; continue; }
                # Marked before npm ci: a failed install leaves node_modules half-replaced.
                reinstalled[$d]=1
              fi
              as_owner "$d" bash -c 'cd "$1" && npm ci --omit=dev --no-audit --no-fund' _ "$d" || return 1
            done
          }
          healthy() {
            for _ in $(seq 1 30); do
              if body=$(curl -fsS --max-time 5 "http://127.0.0.1:$PORT/api/health" 2>/dev/null); then
                echo "$body" | node -e '
                  let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                    const h=JSON.parse(s), want=process.argv[1].replace(/^v/,""), wantParent=process.argv[2];
                    console.log("ok="+h.ok+" version="+h.version+" parentVersion="+h.parentVersion);
                    if (!h.ok) process.exit(1);
                    if (/^\d+\.\d+\.\d+/.test(want) && h.version!==want) { console.error("version "+h.version+" != "+want); process.exit(1); }
                    if (wantParent && h.parentVersion!==wantParent) { console.error("parentVersion "+h.parentVersion+" != "+wantParent); process.exit(1); }
                  })' "$1" "${2:-}" && return 0
                return 1
              fi
              sleep 2
            done
            return 1
          }
          HELD_TIMERS=()
          hold_timers() {
            local u t s waited=0
            for u in career-ops-scan career-ops-eval; do
              t="$u.timer"
              if systemctl is-active --quiet "$t" 2>/dev/null; then
                systemctl stop "$t" && HELD_TIMERS+=("$t")
              fi
            done
            [ ${#HELD_TIMERS[@]} -gt 0 ] && echo "timers held: ${HELD_TIMERS[*]}"
            # A running oneshot is "activating" (is-active says no) — read ActiveState.
            while :; do
              s=""
              for u in career-ops-scan.service career-ops-eval.service; do
                case "$(systemctl show -p ActiveState --value "$u" 2>/dev/null)" in
                  activating|deactivating) s="$s $u" ;;
                esac
              done
              [ -z "$s" ] && break
              if [ "$waited" -ge "${SCAN_WAIT_S:-900}" ]; then
                echo "::warning::still running after ${waited}s:$s — restarting anyway"
                break
              fi
              [ "$waited" -eq 0 ] && echo "waiting for:$s"
              sleep 10; waited=$((waited + 10))
            done
            [ "$waited" -gt 0 ] && echo "waited ${waited}s for the scan/eval run to finish"
            return 0
          }
          resume_timers() {
            local t
            for t in "${HELD_TIMERS[@]}"; do
              systemctl start "$t" || echo "::warning::could not restart $t"
            done
            HELD_TIMERS=()
          }
          rollback() {
            # Best effort all the way through: one failing step must not skip the restart.
            trap - ERR
            set +e
            resume_timers
            echo "::error::deploy failed; restoring the pre-deploy files from $BK"
            for d in "$APP_DIR" "$UI_DIR"; do
              n=${name[$d]}
              (cd "$d" && xargs -r -d '\n' rm -f -- < "$BK/$n.created")
              tar -C "$d" -xzpf "$BK/$n.tgz" --same-owner
            done
            install_deps rollback || echo "::error::npm ci failed during rollback"
            systemctl restart "$SERVICE" || echo "::error::restart failed during rollback"
            healthy skip || echo "::error::service still unhealthy after rollback"
            exit 1
          }

          # From here on, any failure restores the pre-deploy files.
          set -E
          trap rollback ERR
          for d in "$APP_DIR" "$UI_DIR"; do
            g "$d" archive --format=tar "${ref[$d]}" | as_owner "$d" tar -x -C "$d"
            n=${name[$d]}
            if [ -s "$BK/$n.deleted" ]; then
              (cd "$d" && xargs -r -d '\n' rm -f -- < "$BK/$n.deleted")
              echo "$n: removed $(wc -l < "$BK/$n.deleted") files deleted upstream (backed up in $BK/$n.tgz)"
            fi
          done
          want_parent=$(head -1 "$APP_DIR/VERSION" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "parent now $(g "$APP_DIR" log -1 --format='%h %s' "$PARENT_REF") VERSION=$want_parent"
          echo "web-ui now $UI_REF ($(node -p "require('$UI_DIR/package.json').version"))"
          install_deps
          # V8's default heap on this 1 GB box (~240 MB) was exhausted by in-process
          # scans (FATAL "JavaScript heap out of memory", 2026-09-27, twice).
          if [ "$HEAP_MB" != 0 ]; then
            dropin="${SYSTEMD_DIR:-/etc/systemd/system}/$SERVICE.service.d/heap.conf"
            want="[Service]
          Environment=NODE_OPTIONS=--max-old-space-size=$HEAP_MB"
            if [ "$(cat "$dropin" 2>/dev/null)" != "$want" ]; then
              install -d "$(dirname "$dropin")"
              printf '%s\n' "$want" > "$dropin"
              systemctl daemon-reload
              echo "heap drop-in set: --max-old-space-size=$HEAP_MB"
            fi
          fi
          # Request guard: which Host names the app accepts besides loopback and IP literals.
          if [ -n "${ALLOWED_HOSTS:-}" ]; then
            dropin="${SYSTEMD_DIR:-/etc/systemd/system}/$SERVICE.service.d/hosts.conf"
            want="[Service]
          Environment=ALLOWED_HOSTS=$ALLOWED_HOSTS"
            if [ "$(cat "$dropin" 2>/dev/null)" != "$want" ]; then
              install -d "$(dirname "$dropin")"
              printf '%s\n' "$want" > "$dropin"
              systemctl daemon-reload
              echo "hosts drop-in set: ALLOWED_HOSTS=$ALLOWED_HOSTS"
            fi
          fi
          # The hourly scan runs inside the service: a restart mid-scan killed it
          # (2026-10-07 06:04, "service restarted mid-scan"). Hold the scan/eval
          # timers, let a running one finish (up to SCAN_WAIT_S, default 900 s — a scan
          # takes ~13 min), then restart.
          hold_timers
          systemctl restart "$SERVICE"
          healthy "$UI_REF" "$want_parent"
          resume_timers
          trap - ERR
          # hermes-agent is not part of this deploy; it only has to still be up
          # and able to reach the viewer's LLM bridge.
          for u in hermes-gateway claude-bridge; do
            echo "$u: $(systemctl is-active "$u")"
            systemctl is-active --quiet "$u" || echo "::warning::$u is not active"
          done
          echo "deploy OK — rollback material kept in $BK"
          REMOTE

      - name: Cleanup plan (read-only dry run)
        if: inputs.mode == 'cleanup-plan'
        env:
          APP_DIR: ${{ inputs.app_dir }}
        run: |
          # Numbers only — the log is public and file names carry company names.
          # shellcheck disable=SC2029
          ssh prod "cd '$APP_DIR/web-ui' && CAREER_OPS_ROOT='$APP_DIR' node scripts/post-qa-cleanup.mjs 2>&1 | grep -cE 't-role|ZZ-QA-TEST|dirty-URL' || true; echo 'cleanup-plan done (dry run — nothing changed)'"

      - name: Cleanup apply (with automatic backups)
        if: inputs.mode == 'cleanup-apply'
        env:
          APP_DIR: ${{ inputs.app_dir }}
        run: |
          # Same as the plan, but --apply: writes backups and moves the junk.
          # Numbers only in the log — no file names, no line previews.
          # shellcheck disable=SC2029
          ssh prod "cd '$APP_DIR/web-ui' && CAREER_OPS_ROOT='$APP_DIR' node scripts/post-qa-cleanup.mjs --apply 2>&1 | grep -cE 't-role|ZZ-QA-TEST|dirty-URL|backup' || true; echo 'cleanup-apply done'; ls '$APP_DIR/web-ui/qa/cleanup-backup-'* 2>/dev/null | wc -l"

      - name: Verify (read-only smoke)
        if: inputs.mode != 'recon' && inputs.mode != 'cleanup-plan' && inputs.mode != 'cleanup-apply'
        env:
          APP_DIR: ${{ inputs.app_dir }}
          PORT: ${{ inputs.port }}
          SERVICE: ${{ inputs.service }}
        run: |
          # Status codes and sizes only — bodies carry profile data and this log is public.
          # The inputs were validated against [A-Za-z0-9._/@-] in "Configure ssh".
          # shellcheck disable=SC2029  # APP_DIR/PORT/SERVICE are meant to expand locally
          ssh prod "APP_DIR='$APP_DIR' PORT='$PORT' SERVICE='$SERVICE' bash -s" <<'REMOTE'
          set -uo pipefail
          base="http://127.0.0.1:$PORT"; fail=0
          probe() {
            local path=$1 want=${2:-200} out code size
            out=$(curl -s -o /dev/null -w '%{http_code} %{size_download}' --max-time 20 "$base$path")
            code=${out% *}; size=${out#* }
            printf '%-32s %s %8s B\n' "$path" "$code" "$size"
            [ "$code" = "$want" ] || { echo "::error::$path returned $code (want $want)"; fail=1; }
          }
          for pth in / /js/app.js /js/router.js /api/ping /api/health /api/dashboard /api/tracker /api/tracker/stages \
                     /api/pipeline /api/reports /api/scan-results /api/scan/sources /api/scan/regional/config \
                     /api/scan/reposts /api/stats/funnel /api/stats/trend /api/stats/lifetime /api/stats/patterns \
                     /api/stats/salary-gap /api/stats/company-history /api/stats/rejection-latency /api/stats/upskill \
                     /api/status/providers /api/modes /api/portals /api/config /api/profile /api/cv /api/usage \
                     /api/activity /api/jds /api/followup /api/output/pdfs; do
            probe "$pth"
          done
          probe /api/definitely-not-a-route 404
          # The running process must serve the registry that is on disk — i.e. it
          # actually loaded the deployed code. Both numbers come from the live
          # registry; nothing is hard-coded.
          served=$(curl -fsS --max-time 20 "$base/api/scan/sources" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).sources.length)}catch{console.log("unreadable")}})')
          on_disk=$(cd "$APP_DIR/web-ui" && sudo -u "$(stat -c %U .)" -H -- node --input-type=module -e 'const { SOURCES } = await import(process.cwd() + "/server/lib/sources/registry.mjs"); console.log(SOURCES.length)' 2>/dev/null)
          echo "sources served: $served · in the deployed registry: $on_disk"
          [ -n "$on_disk" ] && [ "$served" = "$on_disk" ] || { echo "::error::served source count differs from the deployed registry"; fail=1; }
          echo "--- security headers from the app itself"
          curl -sI --max-time 10 "$base/" | grep -iE '^(content-security-policy|x-content-type-options|x-frame-options|referrer-policy):' | cut -c1-90
          echo "--- Hermes"
          since=$(systemctl show -p ActiveEnterTimestamp --value "${SERVICE:-career-ops-ui}")
          for u in hermes-gateway claude-bridge "${SERVICE:-career-ops-ui}"; do
            printf '%-16s %s (restarts: %s, since %s)\n' "$u" "$(systemctl is-active "$u")" \
              "$(systemctl show -p NRestarts --value "$u")" "$(systemctl show -p ActiveEnterTimestamp --value "$u")"
            systemctl is-active --quiet "$u" || fail=1
          done
          printf 'bridge /v1/models: %s\n' "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8788/v1/models)"
          errs=$(journalctl -u "${SERVICE:-career-ops-ui}" --since "$since" -p err --no-pager -q 2>/dev/null | wc -l)
          echo "journal error lines for ${SERVICE:-career-ops-ui} since start: $errs"
          [ "$errs" = 0 ] || echo "::warning::$errs error lines in the journal since start (not printed: may contain personal data)"
          echo "--- stability (last 24h): exits, OOM, memory, proxy errors — kinds only, no payloads"
          journalctl -u "${SERVICE:-career-ops-ui}" --since "-24h" --no-pager -o short-iso 2>/dev/null \
            | grep -E "Main process exited|Failed with result|Scheduled restart|Started |Stopped |FATAL ERROR|heap out of memory|RangeError|TypeError|ReferenceError|ERR_[A-Z_]+|uncaught|Unhandled" \
            | sed -E 's/(Error: .{0,80}).*/\1…/' | tail -20
          journalctl -k --since "-24h" --no-pager 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | sed -E 's/(task=|comm=)[^ ,]*/\1…/g' | tail -5 || true
          free -m | head -2
          systemctl show -p MemoryCurrent -p MemoryPeak -p MemoryMax --value "${SERVICE:-career-ops-ui}" 2>/dev/null | paste -sd' ' | sed 's/^/memory current|peak|max: /'
          c502=$(journalctl -u caddy --since "-24h" --no-pager 2>/dev/null | grep -c '"status":502' || true)
          echo "caddy 502 responses (24h): $c502"
          # Caddy's reverse-proxy failures are logged by http.log.error with the
          # reason in "msg" (the "error" field is only QUIC/TLS chatter). Kinds
          # only — addresses masked, no URIs or headers.
          echo "--- caddy proxy errors since the viewer started (kinds)"
          journalctl -u caddy --since "$since" --no-pager -o cat 2>/dev/null | grep '"logger":"http.log.error"' \
            | grep -oE '"msg":"[^"]{0,140}' | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(:[0-9]+)?/<addr>/g' \
            | sort | uniq -c | sort -rn | head -8
          echo "--- caddy 502s per minute since the viewer started (UTC)"
          journalctl -u caddy --since "$since" --no-pager -o short-iso 2>/dev/null | grep '"status":502' \
            | cut -c1-16 | sort | uniq -c | tail -30
          echo "--- scan timer (last 3h): outcome lines only"
          journalctl -u career-ops-scan --since "-3h" --no-pager -o short-iso 2>/dev/null \
            | grep -E "scan (triggered|failed)|truncated|Deactivated successfully|Failed with result|Starting|Finished" | tail -12
          exit $fail
          REMOTE

      - name: Public check (HTTPS)
        env:
          PUBLIC_URL: ${{ inputs.public_url || secrets.PROD_URL }}
        run: |
          set -euo pipefail
          [ -n "$PUBLIC_URL" ] || { echo "::notice::no public_url and no PROD_URL secret — public check skipped"; exit 0; }
          PUBLIC_URL="${PUBLIC_URL%/}"
          # The site sits behind HTTP basic auth, so 401 means "up and gated".
          for p in / /api/health; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$PUBLIC_URL$p")
            echo "GET $p -> $code"
            case "$code" in 200|401) ;; *) echo "::error::unexpected $code for $p"; exit 1;; esac
          done
          echo "--- security headers on /"
          curl -sSI --max-time 15 "$PUBLIC_URL/" | grep -iE '^(content-security-policy|strict-transport-security|x-content-type-options|x-frame-options|www-authenticate):' || echo "(none)"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
